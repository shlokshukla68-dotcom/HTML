<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form in HTML</title>

    <style>
        header {
            color: white;
            font-size: 50px;
            background: black;
            box-shadow: 10px 10px 10px gray;
            text-align: center;
            padding: 20px;
        }

        main {
            /* background: red; */
            width: 50%;
            margin: auto;
        }

        table {
            border: 1px black solid;
            width: 70%;
            border-radius: 10px;
            padding: 0px;
            margin-top: 20px;
            box-shadow: 10px 10px 10px gray;
        }

        input {
            width: 100%;
            height: 30px;
        }
    </style>
</head>

<body>
    <header>Form in HTML</header>

    <main>
        <table border="0" cellpadding="20">
            <caption style="font-size:50px">Login form</caption>

            <form action="http://tataplay.com/user/get.php" method="post">
                <tr>
                    <td>
                        <label for="loginid">Login Id</label>
                    </td>
                    <td>
                        <input type="text"
                               placeholder="Enter Login id"
                               id="loginid"
                               title="Type id here"
                               required>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="passid">Password</label>
                    </td>
                    <td>
                        <input type="password"
                               required
                               placeholder="Enter Password here"
                               id="passid"
                               title="Type password..">
                    </td>
                </tr>

                <tr>
                    <td></td>
                    <td>
                        <input type="submit" value="login">
                        <input type="reset">
                    </td>
                </tr>
            </form>
        </table>
    </main>
</body>
</html>
