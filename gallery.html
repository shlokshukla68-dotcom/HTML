
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        header {
            background: black;
            color: white;
            text-align: center;
            padding: 25px;
            font-size: 35px;
        }

        h2 {
            text-align: center;
            margin-top: 30px;
        }

        .gallery {
            width: 90%;
            margin: 30px auto;
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .gallery img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 5px 12px #aaa;
            cursor: pointer;
            transition: 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px #777;
        }

        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 85vh;
            object-fit: contain;
        }

        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>My Photo Gallery</header>

    <h2>Beautiful Photo Collection</h2>

    <div class="gallery">
        <img src="https://picsum.photos/id/1015/600/400" alt="Nature" onclick="openImage(this)">
        <img src="https://picsum.photos/id/1025/600/400" alt="Animal" onclick="openImage(this)">
        <img src="https://picsum.photos/id/1035/600/400" alt="Landscape" onclick="openImage(this)">
        <img src="https://picsum.photos/id/1043/600/400" alt="Mountain" onclick="openImage(this)">
        <img src="https://picsum.photos/id/1050/600/400" alt="Scenery" onclick="openImage(this)">
        <img src="https://picsum.photos/id/1069/600/400" alt="Nature view" onclick="openImage(this)">
    </div>

    <div class="lightbox" id="lightbox" onclick="closeImage()">
        <span class="close">&times;</span>
        <img id="largeImage" alt="Selected Photo"
             onclick="event.stopPropagation()">
    </div>

    <script>
        function openImage(img) {
            document.getElementById("lightbox").style.display = "flex";
            document.getElementById("largeImage").src = img.src;
        }

        function closeImage() {
            document.getElementById("lightbox").style.display = "none";
        }
    </script>

</body>
</html>
