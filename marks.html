
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Table</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        h1 {
            text-align: center;
            background-color: black;
            color: white;
            padding: 20px;
        }

        table {
            width: 80%;
            margin: 30px auto;
            border-collapse: collapse;
            background-color: white;
            box-shadow: 5px 5px 15px gray;
        }

        th, td {
            border: 1px solid black;
            padding: 15px;
            text-align: center;
        }

        th {
            background-color: #007bff;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #eeeeee;
        }

        .result {
            background-color: #d4edda;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Student Marks Obtained</h1>

    <h2 align="center">Student Marksheet</h2>

    <p align="center">
        <b>Name:</b> Rahul Sharma <br>
        <b>Roll No:</b> 101 <br>
        <b>Class:</b> 12th
    </p>

    <table>
        <tr>
            <th>S.No</th>
            <th>Subject</th>
            <th>Maximum Marks</th>
            <th>Obtained Marks</th>
        </tr>

        <tr>
            <td>1</td>
            <td>English</td>
            <td>100</td>
            <td>85</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Hindi</td>
            <td>100</td>
            <td>90</td>
        </tr>

        <tr>
            <td>3</td>
            <td>Mathematics</td>
            <td>100</td>
            <td>95</td>
        </tr>

        <tr>
            <td>4</td>
            <td>Science</td>
            <td>100</td>
            <td>88</td>
        </tr>

        <tr>
            <td>5</td>
            <td>Computer</td>
            <td>100</td>
            <td>92</td>
        </tr>

        <tr class="result">
            <td colspan="2">Total Marks</td>
            <td>500</td>
            <td>450</td>
        </tr>

        <tr class="result">
            <td colspan="3">Percentage</td>
            <td>90%</td>
        </tr>

        <tr class="result">
            <td colspan="3">Result</td>
            <td>PASS</td>
        </tr>
    </table>

</body>
</html>
